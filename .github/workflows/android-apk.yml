name: Build Control X APK

on:
  push:
    branches:
      - main
      - vivekoffical08-jpg-control-x-master-feature
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release with the APK"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Run unit tests
        run: gradle -PappVersionCode=${{ github.run_number }} -PappVersionName=0.1.${{ github.run_number }} testDebugUnitTest

      - name: Build backend API
        run: gradle -p server installDist

      - name: Validate database Compose configuration
        run: docker compose config --quiet

      - name: Build debug APK
        run: gradle -PappVersionCode=${{ github.run_number }} -PappVersionName=0.1.${{ github.run_number }} assembleDebug

      - name: Name release APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            "Control-X-v0.1.${{ github.run_number }}-debug.apk"
          sha256sum "Control-X-v0.1.${{ github.run_number }}-debug.apk" \
            > "Control-X-v0.1.${{ github.run_number }}-debug.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Control-X-debug
          path: |
            Control-X-v0.1.${{ github.run_number }}-debug.apk
            Control-X-v0.1.${{ github.run_number }}-debug.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="v0.1.${{ github.run_number }}"
          gh release delete "$tag" --yes 2>/dev/null || true
          gh release create "$tag" \
            "Control-X-v0.1.${{ github.run_number }}-debug.apk" \
            "Control-X-v0.1.${{ github.run_number }}-debug.apk.sha256" \
            --repo "${{ github.repository }}" \
            --title "Control X $tag" \
            --notes "Automated debug APK build from commit ${{ github.sha }}."
